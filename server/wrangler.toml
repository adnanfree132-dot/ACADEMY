name = "academy-api"
main = "src/worker.ts"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
account_id = "64ce0da1d6bde1c338aa1eed69626c73"
workers_dev = true

[vars]
CLOUDFLARE_WORKER = "1"
NODE_ENV = "production"
PORT = "5000"
DB_POOL_MAX = "4"

[alias]
"iconv-lite" = "./src/iconv-stub.js"
"pg-cloudflare" = "./node_modules/pg-cloudflare/dist/index.js"

[triggers]
crons = ["*/4 * * * *"]
